<!DOCTYPE html>
<html>
<head>
  <title>Form Persistence Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; }
    .test { margin: 10px 0; padding: 10px; background: white; border-left: 4px solid #ccc; }
    .pass { border-color: #4caf50; }
    .fail { border-color: #f44336; }
    .test-name { font-weight: bold; }
    .result { margin-left: 20px; color: #666; }
    button { padding: 10px 20px; margin: 10px 5px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Stronghold Toolkit - Form Persistence Test</h1>
  <p>This test verifies that all form input types save and restore correctly from localStorage.</p>
  
  <button onclick="runTests()">Run All Tests</button>
  <button onclick="clearStorage()">Clear Storage</button>
  
  <div id="results"></div>
  
  <script>
    function clearStorage() {
      localStorage.removeItem('sh_toolkit');
      alert('Storage cleared');
    }
    
    async function runTests() {
      const results = document.getElementById('results');
      results.innerHTML = '<p>Running tests...</p>';
      
      const tests = [];
      
      // Test 1: Text inputs
      tests.push(await testTextInput());
      
      // Test 2: Textareas
      tests.push(await testTextarea());
      
      // Test 3: Select dropdowns
      tests.push(await testSelect());
      
      // Test 4: Checkboxes (single)
      tests.push(await testCheckboxSingle());
      
      // Test 5: Checkboxes (multiple with same name)
      tests.push(await testCheckboxMultiple());
      
      // Test 6: Radio buttons
      tests.push(await testRadio());
      
      // Test 7: Range inputs
      tests.push(await testRange());
      
      // Render results
      let html = '<h2>Test Results</h2>';
      const passed = tests.filter(t => t.pass).length;
      const total = tests.length;
      html += `<p><strong>${passed}/${total} tests passed</strong></p>`;
      
      tests.forEach(test => {
        html += `
          <div class="test ${test.pass ? 'pass' : 'fail'}">
            <div class="test-name">${test.pass ? '✓' : '✗'} ${test.name}</div>
            <div class="result">${test.message}</div>
          </div>
        `;
      });
      
      results.innerHTML = html;
    }
    
    async function testTextInput() {
      const testValue = 'Test Text ' + Date.now();
      const input = document.createElement('input');
      input.type = 'text';
      input.name = 'test_text';
      input.value = testValue;
      document.body.appendChild(input);
      
      // Save
      const saved = saveAndExtract();
      
      // Clear
      input.value = '';
      
      // Restore
      loadFromData(saved);
      
      const pass = input.value === testValue;
      document.body.removeChild(input);
      
      return {
        name: 'Text Input',
        pass: pass,
        message: pass ? `Saved and restored: "${testValue}"` : `Expected "${testValue}", got "${input.value}"`
      };
    }
    
    async function testTextarea() {
      const testValue = 'Test Textarea\nMultiline ' + Date.now();
      const textarea = document.createElement('textarea');
      textarea.name = 'test_textarea';
      textarea.value = testValue;
      document.body.appendChild(textarea);
      
      const saved = saveAndExtract();
      textarea.value = '';
      loadFromData(saved);
      
      const pass = textarea.value === testValue;
      document.body.removeChild(textarea);
      
      return {
        name: 'Textarea',
        pass: pass,
        message: pass ? `Saved and restored multiline text` : `Failed to restore textarea`
      };
    }
    
    async function testSelect() {
      const select = document.createElement('select');
      select.name = 'test_select';
      select.innerHTML = '<option value="">Select...</option><option value="opt1">Option 1</option><option value="opt2">Option 2</option>';
      document.body.appendChild(select);
      
      select.value = 'opt2';
      const saved = saveAndExtract();
      select.value = '';
      loadFromData(saved);
      
      const pass = select.value === 'opt2';
      document.body.removeChild(select);
      
      return {
        name: 'Select Dropdown',
        pass: pass,
        message: pass ? `Saved and restored selected option` : `Failed to restore selection`
      };
    }
    
    async function testCheckboxSingle() {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.name = 'test_cb_single';
      cb.value = 'checked';
      cb.checked = true;
      document.body.appendChild(cb);
      
      const saved = saveAndExtract();
      cb.checked = false;
      loadFromData(saved);
      
      const pass = cb.checked === true;
      document.body.removeChild(cb);
      
      return {
        name: 'Single Checkbox',
        pass: pass,
        message: pass ? `Checkbox state preserved` : `Checkbox state lost`
      };
    }
    
    async function testCheckboxMultiple() {
      const container = document.createElement('div');
      container.innerHTML = `
        <input type="checkbox" name="test_cb_multi" value="option1">
        <input type="checkbox" name="test_cb_multi" value="option2">
        <input type="checkbox" name="test_cb_multi" value="option3">
      `;
      document.body.appendChild(container);
      
      const cbs = container.querySelectorAll('input');
      cbs[0].checked = true;
      cbs[2].checked = true;
      
      const saved = saveAndExtract();
      cbs.forEach(cb => cb.checked = false);
      loadFromData(saved);
      
      const pass = cbs[0].checked && !cbs[1].checked && cbs[2].checked;
      document.body.removeChild(container);
      
      return {
        name: 'Multiple Checkboxes (same name)',
        pass: pass,
        message: pass ? `Multiple selections preserved` : `Multiple selections lost`
      };
    }
    
    async function testRadio() {
      const container = document.createElement('div');
      container.innerHTML = `
        <input type="radio" name="test_radio" value="r1">
        <input type="radio" name="test_radio" value="r2">
        <input type="radio" name="test_radio" value="r3">
      `;
      document.body.appendChild(container);
      
      const radios = container.querySelectorAll('input');
      radios[1].checked = true;
      
      const saved = saveAndExtract();
      radios.forEach(r => r.checked = false);
      loadFromData(saved);
      
      const pass = !radios[0].checked && radios[1].checked && !radios[2].checked;
      document.body.removeChild(container);
      
      return {
        name: 'Radio Buttons',
        pass: pass,
        message: pass ? `Radio selection preserved` : `Radio selection lost`
      };
    }
    
    async function testRange() {
      const range = document.createElement('input');
      range.type = 'range';
      range.name = 'test_range';
      range.min = '1';
      range.max = '5';
      range.value = '3';
      document.body.appendChild(range);
      
      const saved = saveAndExtract();
      range.value = '1';
      loadFromData(saved);
      
      const pass = range.value === '3';
      document.body.removeChild(range);
      
      return {
        name: 'Range Input',
        pass: pass,
        message: pass ? `Range value preserved` : `Range value lost`
      };
    }
    
    // Helper functions (mimicking the actual toolkit code)
    function saveAndExtract() {
      const d = {};
      document.querySelectorAll('input[name]:not([type="checkbox"]):not([type="radio"]), textarea[name], select[name]').forEach(el => {
        d[el.name] = el.value;
      });
      const checkboxGroups = {};
      document.querySelectorAll('input[type="checkbox"][name]').forEach(el => {
        if (!checkboxGroups[el.name]) checkboxGroups[el.name] = [];
        if (el.checked) checkboxGroups[el.name].push(el.value);
      });
      Object.keys(checkboxGroups).forEach(name => {
        d[name] = checkboxGroups[name].join(',');
      });
      document.querySelectorAll('input[type="radio"][name]:checked').forEach(el => {
        d[el.name] = el.value;
      });
      return d;
    }
    
    function loadFromData(d) {
      Object.keys(d).forEach(k => {
        const checkboxes = document.querySelectorAll('input[type="checkbox"][name="' + k + '"]');
        if (checkboxes.length > 0) {
          const checkedValues = d[k].split(',');
          checkboxes.forEach(cb => {
            cb.checked = checkedValues.includes(cb.value);
          });
          return;
        }
        
        const radio = document.querySelector('input[type="radio"][name="' + k + '"][value="' + d[k] + '"]');
        if (radio) {
          radio.checked = true;
          return;
        }
        
        const el = document.querySelector('[name="' + k + '"]');
        if (!el) return;
        el.value = d[k];
      });
    }
  </script>
</body>
</html>
